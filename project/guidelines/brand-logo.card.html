<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="INOVAQO wordmark — cyan on light/dark, ink on mint" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface); font-family: var(--font-mono); display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 200px; }
  .cell img { width: 190px; }
  .tag { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .light { background: var(--n-0); }
  .dark { background: var(--n-950); }
  .mint { background: var(--mint); }
  .light .tag, .mint .tag { color: var(--text-subtle); }
  .dark .tag { color: var(--n-400); }
</style></head>
<body>
  <div class="cell light"><img src="../assets/inovaqo-logo.svg" alt="Inovaqo"><span class="tag">cyan / light</span></div>
  <div class="cell dark"><img src="../assets/inovaqo-logo-white.svg" alt="Inovaqo"><span class="tag">white / dark</span></div>
  <div class="cell mint"><img src="../assets/inovaqo-logo-ink.svg" alt="Inovaqo"><span class="tag">ink / mint</span></div>
</body></html>
