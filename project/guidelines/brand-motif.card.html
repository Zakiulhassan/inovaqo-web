<!-- @dsCard group="Brand" viewport="700x230" name="The growing line" subtitle="Signature motif — a dashed cyan line that leads from section to section" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--n-950); font-family: var(--font-mono); overflow: hidden; }
  .stage { position: relative; height: 230px; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { fill: var(--n-950); stroke: var(--cyan-400); stroke-width: 2.5; }
  .labels { position: absolute; inset: 0; }
  .lab { position: absolute; transform: translateX(-50%); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mint); white-space: nowrap; }
  .lab b { display: block; color: var(--n-400); font-size: 8.5px; font-weight: 400; letter-spacing: .1em; margin-top: 3px; }
</style></head>
<body>
  <div class="stage">
    <svg viewBox="0 0 700 230" preserveAspectRatio="none" fill="none">
      <path class="ino-line__path ino-line__path--flow"
            d="M 20 150 C 130 150, 150 70, 250 70 C 330 70, 340 130, 300 150 C 270 165, 240 120, 290 95 C 360 60, 430 150, 520 120 C 600 95, 620 120, 680 100" />
      <circle class="node" cx="20" cy="150" r="6"></circle>
      <circle class="node" cx="250" cy="70" r="6"></circle>
      <circle class="node" cx="520" cy="120" r="6"></circle>
      <circle class="node" cx="680" cy="100" r="6"></circle>
    </svg>
    <div class="labels">
      <div class="lab" style="left:20px; top:172px; transform:none">Discovery<b>scope the problem</b></div>
      <div class="lab" style="left:250px; top:38px">Design<b>shape the system</b></div>
      <div class="lab" style="left:520px; top:142px">Engineering<b>build it right</b></div>
      <div class="lab" style="left:640px; top:60px">Launch<b>ship & scale</b></div>
    </div>
  </div>
</body></html>
