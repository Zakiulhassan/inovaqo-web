<!-- @dsCard group="Brand" viewport="700x260" name="Voice in use" subtitle="Dark feature surface with script emphasis — the brand mission treatment" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--cyan-900); font-family: var(--font-sans); }
  .wrap { position: relative; height: 260px; padding: 30px 40px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan-300); margin-bottom: 18px; }
  .stmt { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.28; letter-spacing: -0.01em; color: #fff; max-width: 88%; margin: 0; }
  .stmt em { font-family: var(--font-script); font-style: normal; font-weight: 700; font-size: 1.25em; }
  .stmt .c { color: var(--cyan-400); }
  .stmt .w { color: #fff; }
  svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 70px; }
</style></head>
<body>
  <div class="wrap">
    <div class="eyebrow">Brand Mission</div>
    <p class="stmt">To provide <em class="c">intuitive</em> and <em class="w">efficient</em> tools that streamline workflows, enhance focus, and optimise time.</p>
    <svg viewBox="0 0 700 70" preserveAspectRatio="none" fill="none">
      <path class="ino-line__path ino-line__path--flow" d="M -5 50 C 120 50, 150 12, 300 22 C 430 30, 470 60, 600 40 C 660 31, 680 40, 705 36" />
    </svg>
  </div>
</body></html>
