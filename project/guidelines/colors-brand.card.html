<!-- @dsCard group="Colors" viewport="700x190" name="Brand cyan" subtitle="The Inovaqo cyan scale — 400 is the brand color" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 76px; border-radius: var(--radius-md); box-shadow: var(--shadow-xs); border: 1px solid rgba(9,25,27,0.06); }
  .star { position: relative; }
  .star::after { content: "★ brand"; position: absolute; top: 8px; left: 8px; font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; color: var(--n-950); }
  .name { margin-top: 8px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cyan-100)"></div><div class="name">100</div><div class="hex">#C2F4F0</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-200)"></div><div class="name">200</div><div class="hex">#8FEAE3</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-300)"></div><div class="name">300</div><div class="hex">#4FDDD3</div></div>
    <div class="sw"><div class="chip star" style="background:var(--cyan-400)"></div><div class="name">400</div><div class="hex">#10D5C8</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-500)"></div><div class="name">500</div><div class="hex">#0FB7AC</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-600)"></div><div class="name">600</div><div class="hex">#0C9389</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-800)"></div><div class="name">800</div><div class="hex">#0A554F</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-900)"></div><div class="name">900</div><div class="hex">#0A3C40</div></div>
  </div>
</body></html>
