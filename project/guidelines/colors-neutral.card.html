<!-- @dsCard group="Colors" viewport="700x190" name="Neutrals" subtitle="Teal-tinted neutral ramp — ink #09191B to paper #F4FBF8" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 76px; border-radius: var(--radius-md); box-shadow: var(--shadow-xs); border: 1px solid rgba(9,25,27,0.08); }
  .name { margin-top: 8px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--n-25)"></div><div class="name">25</div><div class="hex">#F4FBF8</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-100)"></div><div class="name">100</div><div class="hex">#DCEAE6</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-200)"></div><div class="name">200</div><div class="hex">#C3D6D1</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-300)"></div><div class="name">300</div><div class="hex">#9FB3AF</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-500)"></div><div class="name">500</div><div class="hex">#5C6B6A</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-700)"></div><div class="name">700</div><div class="hex">#2E3A38</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-900)"></div><div class="name">900</div><div class="hex">#0E1B1B</div></div>
    <div class="sw"><div class="chip" style="background:var(--n-950)"></div><div class="name">950</div><div class="hex">#09191B</div></div>
  </div>
</body></html>
