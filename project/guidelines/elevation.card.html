<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px 26px; background: var(--surface-2); font-family: var(--font-mono); }
  .row { display: flex; gap: 24px; }
  .item { text-align: center; flex: 1; }
  .box { height: 60px; background: var(--surface); border-radius: var(--radius-lg); }
  .lab { font-size: 10px; color: var(--text-muted); margin-top: 14px; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lab">xl</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-cyan)"></div><div class="lab">cyan</div></div>
  </div>
</body></html>
