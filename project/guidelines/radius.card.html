<!-- @dsCard group="Spacing" viewport="700x160" name="Radius" subtitle="xs 4 → 2xl 32 + pill" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface); font-family: var(--font-mono); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--cyan-100); border: 1.5px solid var(--cyan-400); border-bottom: none; }
  .lab { font-size: 10px; color: var(--text-muted); margin-top: 8px; }
  .px { font-size: 9px; color: var(--text-subtle); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-xs);border-top-right-radius:var(--radius-xs)"></div><div class="lab">xs</div><div class="px">4</div></div>
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-sm);border-top-right-radius:var(--radius-sm)"></div><div class="lab">sm</div><div class="px">8</div></div>
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-md);border-top-right-radius:var(--radius-md)"></div><div class="lab">md</div><div class="px">12</div></div>
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-lg);border-top-right-radius:var(--radius-lg)"></div><div class="lab">lg</div><div class="px">16</div></div>
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-xl);border-top-right-radius:var(--radius-xl)"></div><div class="lab">xl</div><div class="px">24</div></div>
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-2xl);border-top-right-radius:var(--radius-2xl)"></div><div class="lab">2xl</div><div class="px">32</div></div>
    <div class="item"><div class="box" style="border-top-left-radius:var(--radius-pill);border-top-right-radius:var(--radius-pill)"></div><div class="lab">pill</div><div class="px">999</div></div>
  </div>
</body></html>
