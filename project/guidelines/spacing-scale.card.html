  .bar { background: var(--cyan-400); border-radius: var(--radius-xs); width: 100%; }
  .lab { font-size: 10px; color: var(--text-muted); margin-top: 8px; }
  .px { font-size: 9px; color: var(--text-subtle); }
</style></head>
<body>

    <div class="item" style="width:30px"><div class="bar" style="height:24px"></div><div class="lab">6</div><div class="px">24</div></div>
    <div class="item" style="width:38px"><div class="bar" style="height:32px"></div><div class="lab">8</div><div class="px">32</div></div>

  </div>
</body></html>
