<!-- @dsCard group="Type" viewport="700x210" name="Display — Space Grotesk" subtitle="Headings & hero type, tight tracking" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface); }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 14px; }
  .d1 { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: .98; letter-spacing: -0.02em; color: var(--text-strong); margin: 0; }
  .d2 { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; color: var(--text); margin: 14px 0 0; }
  em { font-family: var(--font-display); font-style: italic; color: var(--brand); }
</style></head>
<body>
  <div class="meta">Space Grotesk · 500 / 700</div>
  <p class="d1">Build sharp. <em>Ship fast.</em></p>
  <p class="d2">We engineer software that makes a difference.</p>
</body></html>
