<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>

  .r:last-child { border-bottom: 0; }

  .spec { font-family: var(--font-display); font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body>
  <div class="r"><span class="tok">5xl · 88</span><span class="spec" style="font-size:42px">Inovaqo</span></div>

  <div class="r"><span class="tok">xl · 28</span><span class="spec" style="font-size:22px">Smart web &amp; mobile apps</span></div>
  <div class="r"><span class="tok">lg · 22</span><span class="spec" style="font-size:18px">Strong engineering, clear comms</span></div>
