<!-- @dsCard group="Type" viewport="700x150" name="Mono labels" subtitle="Space Mono — eyebrows, tags, code & data" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface); display: flex; flex-direction: column; gap: 16px; justify-content: center; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-subtle); }
  .eyebrow { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-press); }
  .mono-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-press); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 5px 12px; }
  .code { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .code b { color: var(--text-strong); font-weight: 700; }
</style></head>
<body>
  <div class="eyebrow">What we do · 01</div>
  <div class="mono-row">
    <span class="tag">AI / ML</span>
    <span class="tag">Mobile</span>
    <span class="tag">Data</span>
    <span class="tag">Scalable</span>
  </div>
  <div class="code">var(--brand) = <b>#10D5C8</b></div>
</body></html>
