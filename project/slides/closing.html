<!-- @dsCard group="Slides" viewport="1280x720" name="Closing slide" subtitle="Sign-off with contact + growing loop" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; }
  .slide { position:relative; width:1280px; height:720px; background: var(--n-950); color:#fff; overflow:hidden; font-family: var(--font-sans); }
  .slide::before { content:""; position:absolute; bottom:-25%; right:-8%; width:760px; height:660px; background: radial-gradient(closest-side, rgba(16,213,200,.20), transparent 70%); }
  .pad { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; z-index:2; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .eyebrow { font-family:var(--font-mono); font-size:15px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan-300); }
  .logo { height:26px; }
  .center { margin:auto 0; }
  h1 { font-family:var(--font-display); font-weight:700; font-size:90px; line-height:1; letter-spacing:-0.03em; margin:0; color:#fff; }
  h1 .s { font-family:var(--font-display); font-style:italic; font-weight:700; color:var(--cyan-400); }
  .row { display:flex; gap:40px; margin-top:40px; }
  .row a { font-size:20px; color:#A9C3BE; }
  .row a b { color:#fff; font-weight:700; }
  svg.line { position:absolute; left:0; right:0; bottom:0; width:100%; height:170px; z-index:1; }
</style></head>
<body>
  <div class="slide">
    <svg class="line" viewBox="0 0 1280 170" preserveAspectRatio="none" fill="none">
      <path class="ino-line__path ino-line__path--flow" d="M -10 110 C 200 110, 250 40, 430 40 C 560 40, 580 110, 510 124 C 460 134, 430 86, 500 64 C 600 34, 760 120, 980 96 C 1120 80, 1200 100, 1290 88" style="stroke-width:3"/>
    </svg>
    <div class="pad">
      <div class="top">
        <span class="eyebrow">Let's build</span>
        <img class="logo" src="../assets/inovaqo-logo-white.svg" alt="Inovaqo">
      </div>
      <div class="center">
        <h1>Tell us what <span class="s">you're building.</span></h1>
        <div class="row">
          <a href="#"><b>hello@inovaqo.com</b></a>
          <a href="#"><b>inovaqo.com</b></a>
        </div>
      </div>
    </div>
  </div>
</body></html>
