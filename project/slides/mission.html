<!-- @dsCard group="Slides" viewport="1280x720" name="Mission slide" subtitle="Brand mission statement — script emphasis on dark teal" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; }
  .slide { position:relative; width:1280px; height:720px; background: var(--cyan-900); color:#fff; overflow:hidden; font-family: var(--font-sans); }
  .pad { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .eyebrow { font-family:var(--font-mono); font-size:15px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan-300); }
  .logo { height:26px; }
  .center { margin:auto 0; }
  .stmt { font-family:var(--font-display); font-weight:600; font-size:58px; line-height:1.28; letter-spacing:-0.01em; margin:0; max-width:20ch; }
  .stmt em { font-family:var(--font-display); font-style:italic; font-weight:700; font-size:1em; margin-right:.04em; }
  .stmt .c { color:var(--cyan-400); } .stmt .w { color:#fff; }
  svg.line { position:absolute; left:0; right:0; bottom:0; width:100%; height:130px; }
</style></head>
<body>
  <div class="slide">
    <svg class="line" viewBox="0 0 1280 130" preserveAspectRatio="none" fill="none">
      <path class="ino-line__path ino-line__path--flow" d="M -10 80 C 220 80, 280 24, 460 36 C 660 50, 700 110, 900 90 C 1080 72, 1180 96, 1290 70" style="stroke-width:3"/>
    </svg>
    <div class="pad">
      <div class="top">
        <span class="eyebrow">Brand Mission</span>
        <img class="logo" src="../assets/inovaqo-logo-white.svg" alt="Inovaqo">
      </div>
      <div class="center">
        <p class="stmt">To provide <em class="c">intuitive</em> and <em class="w">efficient</em> tools that streamline workflows, enhance focus, and optimise time management.</p>
      </div>
    </div>
  </div>
</body></html>
